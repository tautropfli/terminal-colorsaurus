name: Release termtheme

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.target }}
    # Only releases tagged "termtheme-x.y.z"
    if: startsWith(github.event.release.tag_name, 'termtheme-')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # @v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # @stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --locked --release -p termtheme --target ${{ matrix.target }}
          else
            cargo build --locked --release -p termtheme --target ${{ matrix.target }}
          fi

      - name: Package and upload
        shell: bash
        run: |
          dirname="termtheme-${TAG#termtheme-}-${{ matrix.target }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/termtheme.exe" "$dirname"
            7z a "$dirname.zip" "$dirname"
            asset="$dirname.zip"
          else
            cp "target/${{ matrix.target }}/release/termtheme" "$dirname"
            tar -czf "$dirname.tar.gz" "$dirname"
            asset="$dirname.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber
